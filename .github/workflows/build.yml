name: Build and Package

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Lint code
        run: npm run lint

      - name: Package plugin files
        run: |
          mkdir -p dist
          cp manifest.json dist/
          cp main.js dist/
          cp styles.css dist/

      - name: Upload packaged files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-epub-reader-dist
          path: dist/
